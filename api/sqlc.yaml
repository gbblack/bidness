version: "2"

sql:
  - engine: "postgresql"
    schema: "data/migrations"
    queries: "data/queries"
    gen:
      go:
        package: "db"
        out: "data/database/gendb"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
